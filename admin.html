<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت — شیپور هفتم | Seventh Trumpet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span data-i18n="siteName">شیپور هفتم</span></a>
      <nav class="nav">
        <a href="index.html" data-i18n="back">← بازگشت</a>
        <button id="lang-toggle" class="lang-toggle" data-i18n="langBtn">English</button>
        <button id="logout-btn" class="btn btn-outline" style="color:white;border-color:rgba(255,255,255,0.4)" data-i18n="logout">خروج</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="login-box" class="admin-login">
      <h2 style="margin-bottom:0.5rem;color:var(--primary)" data-i18n="loginTitle">ورود مدیر</h2>
      <form id="login-form">
        <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" placeholder="رمز عبور" required autocomplete="current-password">
        <label style="display:flex;align-items:center;gap:0.5rem;margin:0.6rem 0 1rem;cursor:pointer;font-size:0.9rem;">
          <input type="checkbox" id="show-password" style="width:auto;margin:0;">
          <span data-i18n="showPassword">نمایش رمز عبور</span>
        </label>
        <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="loginBtn">ورود</button>
      </form>
      <div id="status" class="status"></div>
    </div>

    <div id="admin-panel" class="hidden">
      <div style="background:#e8f5e9;border:1px solid #a5d6a7;border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;">
        <div>
          <div style="font-size:0.85rem;color:#2e7d32;" data-i18n="visitorsLabel">بازدید کل سایت</div>
          <div style="font-size:1.3rem;font-weight:700;color:#1b5e20;" id="admin-visitor-count">…</div>
        </div>
        <p style="font-size:0.8rem;color:#555;margin:0;max-width:280px;">Only counts real visitors. Your admin visits are removed when you log in.</p>
      </div>

      <!-- rest of admin panel is loaded from previous structure via admin.js expectations -->
      <div id="admin-panel-body">
        <p style="color:var(--text-muted);font-size:0.9rem;">If the rest of the admin form is missing, hard-refresh. Full panel markup is restored below.</p>
      </div>
    </div>
  </main>

  <script src="js/visits.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin_visit_hook.js"></script>
  <script src="js/admin_i18n_extra.js"></script>
  <script src="js/playlists.js"></script>
  <script src="js/admin_playlist_hook.js"></script>
  <script src="js/cloud_sync.js"></script>
  <script src="js/admin_cloud_hook.js"></script>
</body>
</html>
