<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کتاب مقدس — شیپور هفتم</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/bible.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo" data-i18n="siteName">شیپور هفتم</a>
      <nav class="main-nav">
        <a href="index.html" data-i18n="home">خانه</a>
        <a href="media.html" data-i18n="media">رسانه‌ها</a>
        <a href="bible.html" class="active" data-i18n="bibleNav">کتاب مقدس</a>
        <a href="live.html" data-i18n="live">پخش زنده</a>
      </nav>
      <div class="header-actions">
        <button type="button" id="lang-toggle" class="btn btn-outline btn-sm">English</button>
        <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>
  <main class="bible-app">
    <aside class="bible-sidebar">
      <div class="bible-version" id="bible-version-label">هزارۀ نو</div>
      <label class="bible-label" data-i18n="bibleBook">کتاب</label>
      <select id="bible-book"></select>
      <label class="bible-label" data-i18n="bibleChapter">باب</label>
      <select id="bible-chapter"></select>
      <div class="bible-nav-btns">
        <button type="button" id="bible-prev" class="btn btn-outline btn-sm">◀</button>
        <button type="button" id="bible-next" class="btn btn-outline btn-sm">▶</button>
      </div>
      <p class="bible-note" id="bible-note"></p>
    </aside>
    <section class="bible-reader">
      <h1 id="bible-heading" class="bible-heading"></h1>
      <div id="bible-verses" class="bible-verses">
        <p class="bible-loading" data-i18n="bibleLoading">در حال بارگذاری...</p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <p data-i18n="footer">شیپور هفتم — پیام سه فرشته مکاشفه ۱۴</p>
  </footer>
  <script src="js/bible_patch.js"></script>
  <script src="js/bible.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
