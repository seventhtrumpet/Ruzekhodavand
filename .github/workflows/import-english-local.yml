name: Import local English public-domain Bible texts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-english-local.yml
      - scripts/import-english-local.py
      - scripts/build-odr-search-index.py
      - scripts/inspect-web-classic-vpl.py
      - scripts/audit-all-english-vpl-coverage.py

permissions:
  contents: write

jobs:
  import-english-local:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Audit all WEB Classic VPL book codes before import
        run: python scripts/inspect-web-classic-vpl.py

      - name: Audit every English VPL archive against the declared catalogue
        run: python scripts/audit-all-english-vpl-coverage.py

      - name: Download and validate official public-domain VPL archives
        run: python scripts/import-english-local.py

      - name: Build compact Original Douay-Rheims search indexes
        run: python scripts/build-odr-search-index.py

      - name: Commit generated local English books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bible-en/local data/bible-en/odr/search-index.json data/bible-en/odr/original-spelling/search-index.json
          if git diff --cached --quiet; then
            echo "Local English Bible data is already up to date."
            exit 0
          fi
          git commit -m "Add local English public-domain Bible texts"
          git pull --rebase origin main
          git push origin HEAD:main
