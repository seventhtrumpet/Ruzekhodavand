name: Bible data regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bible-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python importer and audit syntax
        run: |
          python -m py_compile scripts/import-english-local.py
          python -m py_compile scripts/audit-all-english-vpl-coverage.py
          python -m py_compile scripts/inspect-web-classic-vpl.py
          python -m py_compile scripts/test-bible-data.py

      - name: Check Bible reader JavaScript syntax
        run: |
          node --check js/bible.js
          node --check js/bible-core-pinned.js
          node --check js/bible_search.js
          node --check js/bible-share.js
          node --check js/bible-share-photo.js
      - name: Validate Bible datasets and reader safeguards
        run: python scripts/test-bible-data.py
