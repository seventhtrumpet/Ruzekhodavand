name: Bible data regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bible-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python importer and audit syntax
        run: |
          python -m py_compile scripts/import-english-local.py
          python -m py_compile scripts/import-opv.py
          python -m py_compile scripts/import-opcb.py
          python -m py_compile scripts/import-odr.py
          python -m py_compile scripts/build-odr-search-index.py
          python -m py_compile scripts/audit-odr-exact.py
          python -m py_compile scripts/audit-all-english-vpl-coverage.py
          python -m py_compile scripts/audit-local-english-exact.py
          python -m py_compile scripts/audit-persian-exact.py
          python -m py_compile scripts/inspect-web-classic-vpl.py
          python -m py_compile scripts/test-bible-data.py

      - name: Check Bible reader JavaScript syntax
        run: |
          node --check js/bible.js
          node --check js/bible-core-pinned.js
          node --check js/bible_search.js
          node --check js/bible-share.js
          node --check js/bible-share-photo.js
          node --check js/app_media.js
          node --check js/media_rotator.js
          node scripts/test-media-rotator-youtube.js
          node scripts/test-youtube-embed-url.js
          node --check js/bugfixes.js
          node scripts/test-html-escaping.js
          node scripts/test-safe-media-url.js
          node --check js/playlists.js
          node --check js/user_playlists.js
          node scripts/test-dynamic-html-actions.js
      - name: Validate Bible datasets and reader safeguards
        run: python scripts/test-bible-data.py
      - name: Collate every local English verse against pinned source archives
        run: python scripts/audit-local-english-exact.py
      - name: Collate every local Persian verse against pinned source files
        if: always()
        run: python scripts/audit-persian-exact.py
      - name: Collate both local Original Douay-Rheims spellings against pinned sources
        if: always()
        run: python scripts/audit-odr-exact.py
