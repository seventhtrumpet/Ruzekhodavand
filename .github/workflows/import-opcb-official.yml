name: Import official OPCB USFM edition

on:
  push:
    branches: [main]
    paths:
      - "scripts/import-opcb-official.py"
      - ".github/workflows/import-opcb-official.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-opcb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert official USFM archive into the parallel site edition
        run: python scripts/import-opcb-official.py
      - name: Commit generated official OPCB files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bible-fa/opcb-official
          if git diff --cached --quiet; then
            echo "Official OPCB files are already current."
          else
            git commit -m "Add official OPCB 2022 reader edition"
            git push
          fi
