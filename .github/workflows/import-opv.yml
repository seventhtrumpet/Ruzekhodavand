name: Import Persian OPV Bible data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-opv.yml
      - scripts/import-opv.py

permissions:
  contents: write

jobs:
  import-opv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download, validate, and convert the official OPV archive
        run: python scripts/import-opv.py

      - name: Commit generated Bible books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bible-fa/opv
          if git diff --cached --quiet; then
            echo "OPV data is already up to date."
            exit 0
          fi
          git commit -m "Add locally hosted Persian OPV Bible data"
          git push origin HEAD:main
