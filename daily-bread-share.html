<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a2540">
  <title>Daily Bible Verse | Seventh Trumpet</title>
  <meta name="description" content="A Bible verse shared by Seventh Trumpet in Persian and English.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Daily Bible Verse | Seventh Trumpet">
  <meta property="og:description" content="Read and share the daily Bible verse in Persian and English.">
  <meta property="og:image" content="https://iili.io/n8MSJBp.jpg">
  <meta property="og:url" content="https://www.seventhtrumpet.org/daily-bread-share.html">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px 36px;background:linear-gradient(160deg,#071b31,#123b58 58%,#071827);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start}
    .share-wrap{width:min(100%,520px);text-align:center}
    .profile-photo{position:relative;z-index:2;width:118px;height:118px;border-radius:50%;object-fit:cover;border:4px solid #d4b45d;background:#0a2540;box-shadow:0 8px 24px rgba(0,0,0,.38);display:block;margin:0 auto -34px}
    .verse-card{position:relative;padding:52px 22px 24px;border:1px solid rgba(212,180,93,.85);border-radius:22px;background:#fff;color:#172b3e;box-shadow:0 14px 36px rgba(0,0,0,.28);text-align:center}
    .brand{font-size:1.2rem;font-weight:850;letter-spacing:.08em;color:#0a2540;margin:0 0 4px}
    .brand-fa{font-size:1.05rem;font-weight:700;color:#7b6123;margin:0 0 18px}
    .section-label{font-size:.78rem;font-weight:800;letter-spacing:.12em;color:#9b7824;margin:18px 0 8px}
    .verse-fa{font-size:1.12rem;line-height:1.95;margin:0;color:#172b3e}
    .verse-en{font-size:1rem;line-height:1.75;margin:0;color:#26394a}
    .ref{font-size:.9rem;font-weight:750;color:#8a6a20;margin:8px 0 0}
    .rule{height:1px;background:linear-gradient(90deg,transparent,#c9a227,transparent);margin:18px 0}
    .links{display:grid;gap:8px;margin-top:18px}
    .info-link{display:block;padding:10px 12px;border:1px solid #e3e8ed;border-radius:12px;color:#0b3859;text-decoration:none;font-weight:750;overflow-wrap:anywhere}
    .info-link small{display:block;color:#6b7785;font-size:.72rem;font-weight:650;margin-bottom:2px}
    .social-title{font-size:.82rem;font-weight:800;color:#5d6d7b;margin:20px 0 10px}
    .socials{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .social{width:58px;height:58px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#fff;font-size:.65rem;font-weight:750;box-shadow:0 4px 10px rgba(0,0,0,.12)}
    .social svg{width:23px;height:23px;fill:currentColor}
    .facebook{background:#1877f2}.telegram{background:#229ed9}.instagram{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.youtube{background:#e62117}
    .handle{font-size:.78rem;color:#687887;margin:12px 0 0;font-weight:700}
    .footer-site{margin:16px 0 0;color:#f1d58a;font-size:.84rem;font-weight:750}
    @media(max-width:380px){.verse-card{padding-inline:16px}.profile-photo{width:106px;height:106px}}
  </style>
</head>
<body>
  <main class="share-wrap">
    <img class="profile-photo" src="https://iili.io/n8MSJBp.jpg" alt="Seventh Trumpet profile picture">
    <article class="verse-card">
      <h1 class="brand">SEVENTH TRUMPET</h1>
      <p class="brand-fa" lang="fa" dir="rtl">شیپور هفتم</p>
      <p class="section-label" lang="fa" dir="rtl">آیه کتاب مقدس</p>
      <p id="verse-fa" class="verse-fa" lang="fa" dir="rtl"></p>
      <p id="ref-fa" class="ref" lang="fa" dir="rtl"></p>
      <div class="rule"></div>
      <p class="section-label">DAILY BIBLE VERSE</p>
      <p id="verse-en" class="verse-en"></p>
      <p id="ref-en" class="ref"></p>
      <div class="rule"></div>
      <a class="info-link" href="https://www.seventhtrumpet.org/" target="_blank" rel="noopener">
        <small>WEBSITE / وب‌سایت</small>www.seventhtrumpet.org
      </a>
    </article>
  </main>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      function set(id, value) { document.getElementById(id).textContent = value || ''; }
      function render(v) {
        set('verse-fa', v.fa);
        set('ref-fa', v.ref_fa || v.refFa || v.ref);
        set('verse-en', v.en || v.fa);
        set('ref-en', v.ref_en || v.refEn || v.ref);
        var ref = v.ref_en || v.ref_fa || '';
        if (ref) document.title = ref + ' | Seventh Trumpet';
      }
      var idx = p.get('i');
      if (idx !== null && /^\d+$/.test(idx)) {
        var s = document.createElement('script');
        s.src = '/js/daily_verses.js';
        s.onload = function () {
          var verses = window.DAILY_VERSES || [];
          var v = verses[Number(idx)];
          if (v) render(v);
          else set('verse-en', 'Daily Bible verse');
        };
        document.head.appendChild(s);
      } else {
        render({
          fa: p.get('fa') || 'هر روز کلام خدا را بخوانید و در محبت او زندگی کنید.',
          en: p.get('en') || 'Read God’s Word daily and live in His love.',
          ref_fa: p.get('rf') || '',
          ref_en: p.get('re') || ''
        });
      }
    })();
  </script>
</body>
</html>
